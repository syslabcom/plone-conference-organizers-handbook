# Plone Conference Organizers Handbook: master chapter list.
#
# Machine-readable source of truth for every page the handbook will contain.
# Specified in docs/spec/README.md; schema in docs/spec/chapter-template.md ("Master chapter list").
# Source: section 4.1 of the handbook plan.
#
# Entry keys (all required):
#   id          unique slug, lowercase letters, digits and hyphens; used in anchors, ledger dispositions, scenarios
#   title       human title; sentence case
#   part        "0".."5" or "appendices"
#   workstream  grouping slug (a Part 2 group, or the part's own slug for other parts)
#   kind        chapter | page | playbook | annex | appendix | generated
#   path        repo-relative path of the Markdown file, always under docs/
#   status      planned | written
# A planned entry is an expected failure (xfail strict) in the chapter contract test.
# The commit that writes the page flips status to written and removes the xfail in the same commit.

