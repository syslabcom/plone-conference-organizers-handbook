# Read the Docs configuration file
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html for details.
# Hosting on Read the Docs is an offering, not a commitment (decision D4).
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  commands:
    # Cancel pull request builds that do not change the docs, build files, or requirements.
    # Exit code 183 makes Read the Docs cancel the build.
    - |
      if [ "$READTHEDOCS_VERSION_TYPE" = "external" ] && git diff --quiet origin/main -- docs/ Makefile .readthedocs.yaml requirements-initial.txt requirements.txt;
      then
        exit 183;
      fi
    - pip install -r requirements-initial.txt
    - pip install -r requirements.txt
    - cd docs && sphinx-build -b html -d ../_build/doctrees . ${READTHEDOCS_OUTPUT}/html/
