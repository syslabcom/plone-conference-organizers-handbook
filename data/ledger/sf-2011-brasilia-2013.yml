  topic: ticketing-and-registration
  scope: specific
  year: 2011
  place: San Francisco
  org: Plone Conference 2011 organizing team
  source_id: S024
  text_kind: paraphrase
  quote_or_paraphrase: In 2011 the team compared three ticketing services and chose the cheapest one with a usable API, connected to a merchant account; it saved building a front end. Trainers used a different service for their training fees.
  confidence: observed
  status: active
  disposition: "placed: ticketing-and-registration#case-notes"
  locator: Tickets, Software
