  topic: ticketing-and-registration
  scope: general
  year: 2011
  place: San Francisco
  org: Plone Conference 2011 organizing team
  source_id: S024
  text_kind: paraphrase
  quote_or_paraphrase: Offer a group discount and advertise it. The 2011 conference had none and attendees asked for one often.
