  source_id: S025
  text_kind: paraphrase
  quote_or_paraphrase: Set aside a small thank-you reserve for helpers who go far beyond their role (the 2011 guide suggested USD 1,500, as of 2011). In 2011 it went to designers who had worked without expecting payment.
