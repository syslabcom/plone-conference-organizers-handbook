  topic: ticketing-and-registration
  scope: general
  year: 2011
  place: San Francisco
  org: Plone Conference 2011 organizing team
  source_id: S024
  text_kind: paraphrase
  quote_or_paraphrase: Collect an email address for every attendee, not only for the person placing the order. In 2011 the ticket system did not require it, and when the mailing list broke some attendees missed announcements.
  confidence: observed
  status: active
  disposition: "placed: ticketing-and-registration#how-to"
  locator: Tickets, Software
