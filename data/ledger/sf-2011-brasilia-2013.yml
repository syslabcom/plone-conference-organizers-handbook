- ledger_id: L-3016
  topic: ticketing-and-registration
  scope: general
  year: 2011
  place: San Francisco
  org: Plone Conference 2011 organizing team
  source_id: S024
  text_kind: paraphrase
  quote_or_paraphrase: Publish no refunds and no transfers, but allow a few transfers for extreme cases at the organizers' discretion. The 2011 organizer recommended keeping this policy because an open policy could get out of control.
  confidence: observed
  status: active
  disposition: "placed: ticketing-and-registration#decisions-you-must-make"
