- ledger_id: L-3014
  topic: ticketing-and-registration
  scope: specific
  year: 2011
  place: San Francisco
  org: Plone Conference 2011 organizing team
  source_id: S024
  text_kind: paraphrase
  quote_or_paraphrase: "Setting the speaker ticket rate equal to the early-bird rate worked well in 2011: speakers paid the same as early buyers, so there were no refunds to manage when talks were accepted."
  confidence: observed
  status: active
  disposition: "placed: ticketing-and-registration#case-notes"
