  scope: specific
  year: 2011
  place: San Francisco
  org: Plone Conference 2011 organizing team
  source_id: S024
  text_kind: paraphrase
  quote_or_paraphrase: In 2011 a group order asked questions such as t-shirt size only once per order, not once per attendee, so per-person data was lost. Check that the ticketing tool collects per-attendee answers in multi-ticket orders.
