  text_kind: paraphrase
  quote_or_paraphrase: "Per the 2011 wiki (as of 2011): 16 free tickets (8 to volunteers), 103 early-bird, 30 speaker, 7 student, 104 full-price and 5 other tickets, for USD 76,050 in ticket income. The Budget page rounds ticket income to USD 79K, so the two pages disagree slightly."
  confidence: observed
  status: active
  disposition: "placed: conference-data-table"
