  org: Plone Conference 2011 organizing team
  source_id: S024
  text_kind: paraphrase
  quote_or_paraphrase: The 2011 team set the budget first and worked backward to a ticket price, and grossly underestimated how many free tickets they would give away (high-level sponsors, volunteers, contest winners). Budget for complimentary tickets explicitly.
