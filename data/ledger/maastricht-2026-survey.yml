    scope: general
    year: 2026
    place: Maastricht
    org: Plone Conference 2026 organizing team
    source_id: S110
    text_kind: paraphrase
    quote_or_paraphrase: The attendee survey can run as a simple web form on the community site whose submissions arrive as individual emails. That is enough to collect structured ratings and free text, but it leaves every submission as a private message that must be extracted before analysis.
    confidence: observed
    status: active
    disposition: "placed: survey-template"
    locator: "Header bullets (Source, Method); Appendix — method, reproducibility, privacy"

  - ledger_id: L-6002
    topic: defining-success
    scope: general
    year: 2026
    place: Maastricht
    org: Plone Conference 2026 organizing team
    source_id: S110
    text_kind: paraphrase
    quote_or_paraphrase: Expect a post-conference survey to reach roughly one in five ticket holders; in 2026 it drew 21 responses over about three weeks. Plan the success metrics so that a response rate of that size can still answer them.
    confidence: observed
    status: active
    disposition: "placed: defining-success#how-to"
    locator: "Header bullet: Response rate; ticket total generalized"

