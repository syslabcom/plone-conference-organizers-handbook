    topic: survey-template
    scope: general
    year: 2026
    place: Maastricht
    org: Plone Conference 2026 organizing team
    source_id: S110
    text_kind: paraphrase
    quote_or_paraphrase: Extract every submission into structured data with a deterministic script and compute all ratings and counts with a second script. Every number in the published analysis is then reproducible from the raw submissions, and a reviewer can rerun it instead of trusting a hand tally.
    confidence: observed
    status: active
    disposition: "placed: survey-template"
