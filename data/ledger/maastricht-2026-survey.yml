# T7f: Plone Conference 2026 attendee-survey analysis, extracted into the ledger.
# Source: S110 = data/sources/internal-2026/survey-analysis.md (copy of
#   aftermath/survey/ANALYSIS.md in syslabcom/ploneconference; anonymized, R1-R21).
# The raw form submissions are private and were not read, copied or quoted.
#
# GROUP EXTENSION: docs/spec/ledger-schema.md defines groups 7a-7e only.
# This file extends the scheme with group 7f, ID range L-6000 to L-6999,
# for the 2026 attendee survey. Spec section 1 (group table), LD01 and the
# GROUP_RANGES table in scripts/lint/g7_ledger.py must be extended in the
# integration pass before gate G7 accepts this file.
#
# Confidence mapping:
#   observed - survey method run by the organizing team, form properties,
#              aggregate ratings and counts from the scripted extraction.
#   reported - single- or few-respondent free text, and the analysis's
#              "Interpretation" section (the analyst's own reading; locators
#              name it as such).
# All rows are paraphrases. Respondent R-numbers are anonymous and are not
# needed by any row; none is mapped to a person.
# The raw ticket total is generalized ("about one in five ticket holders").
group: 7f
